<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado Libre · Tus Carts</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#1B1530;line-height:1.5}
  h1{font-size:24px} code{background:#F2EFF8;padding:2px 6px;border-radius:6px} pre{background:#F6F3FC;padding:12px;border-radius:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Conexión con Mercado Libre</h1>
<p>Este servicio busca precios en Mercado Libre para las apps de <a href="https://tus-carts.vercel.app">Tus Carts</a> (Tecno, Mundo Apple, Juguetes y Deporte).</p>
<p>Estado de la conexión:</p>
<pre id="e">Consultando…</pre>
<script>
  fetch('/api/estado').then(r => r.json()).then(j => { document.getElementById('e').textContent = JSON.stringify(j, null, 2); })
    .catch(() => { document.getElementById('e').textContent = 'No responde'; });
</script>
</body>
</html>
